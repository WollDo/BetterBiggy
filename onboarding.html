<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome to BetterBiggy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 520px;
    }

    /* ── Header ── */
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .logo .accent { color: #f7931a; }

    .tagline {
      font-size: 13px;
      color: #444;
      margin-bottom: 40px;
    }

    /* ── Steps ── */
    .step-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f7931a;
      margin-bottom: 10px;
    }

    .step-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 14px;
    }

    .divider {
      border: none;
      border-top: 1px solid #181818;
      margin: 28px 0;
    }

    /* ── Theme picker ── */
    .theme-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 4px;
    }

    .theme-card {
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-card:hover { border-color: #2e2e2e; }
    .theme-card.selected { border-color: #f7931a66; background: #140f00; }

    .theme-preview {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .theme-preview.dark  { background: #111; border: 1px solid #333; }
    .theme-preview.light { background: #f5f5f5; border: 1px solid #ddd; }

    .theme-name {
      font-size: 14px;
      font-weight: 600;
      color: #ccc;
    }
    .theme-card.selected .theme-name { color: #f7931a; }

    .theme-desc {
      font-size: 11px;
      color: #444;
      margin-top: 2px;
    }

    /* ── Currency picker ── */
    .search-wrap {
      margin-bottom: 8px;
    }

    .search-wrap input {
      width: 100%;
      padding: 9px 12px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: #f7931a33; }
    .search-wrap input::placeholder { color: #333; }

    .currency-list {
      height: 200px;
      overflow-y: auto;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
    }
    .currency-list::-webkit-scrollbar { width: 3px; }
    .currency-list::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    .sec-head {
      padding: 7px 12px 3px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: #2a2a2a;
    }

    .c-item {
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.1s;
      gap: 6px;
    }
    .c-item:hover { background: #111; }
    .c-item.active {
      background: #130f00;
      border-left: 2px solid #f7931a;
      padding-left: 10px;
    }

    .c-code {
      font-size: 12px;
      font-weight: 600;
      color: #777;
    }
    .c-item.active .c-code { color: #f7931a; }

    .c-name {
      font-size: 12px;
      color: #383838;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-results {
      padding: 24px;
      text-align: center;
      color: #2a2a2a;
      font-size: 12px;
    }

    /* ── CTA ── */
    .cta-row {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selected-info {
      font-size: 12px;
      color: #444;
    }
    .selected-info strong { color: #f7931a; }

    .btn {
      background: #f7931a;
      color: #000;
      font-weight: 700;
      font-size: 14px;
      padding: 11px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.3; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="accent">Better</span>Biggy</div>
    <div class="tagline">Set up your preferences to get started.</div>

    <!-- Theme -->
    <div class="step-label">Step 1</div>
    <div class="step-title">Choose a theme</div>
    <div class="theme-options">
      <div class="theme-card selected" data-theme="dark" data-theme="dark">
        <div class="theme-preview dark"></div>
        <div>
          <div class="theme-name">Dark</div>
          <div class="theme-desc">Easy on the eyes</div>
        </div>
      </div>
      <div class="theme-card" data-theme="light" data-theme="light">
        <div class="theme-preview light"></div>
        <div>
          <div class="theme-name">Light</div>
          <div class="theme-desc">Default site style</div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Currency -->
    <div class="step-label">Step 2</div>
    <div class="step-title">Choose your currency</div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search currencies..." autocomplete="off" spellcheck="false">
    </div>
    <div class="currency-list" id="currencyList">
      <div class="no-results">Loading currencies...</div>
    </div>

    <div class="cta-row">
      <div class="selected-info" id="selInfo">No currency selected</div>
      <button class="btn" id="goBtn" disabled>Get started &rarr;</button>
    </div>
  </div>

  <script src="onboarding.js"></script>
</body>
</html>
